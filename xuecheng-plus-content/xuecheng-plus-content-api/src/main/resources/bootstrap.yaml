#微服务配置
spring:
  application:
    name: content-api #服务名称
  profiles:
    active: dev # 环境名称
#  datasource:
#    driver-class-name: com.mysql.cj.jdbc.Driver
#    url: jdbc:mysql://101.35.45.108:3306/xc402_content?serverTimezone=UTC&userUnicode=true&useSSL=false&
#    username: root
#    password: ems816
  # 配置优先级 项目应用名配置文件 > 扩展配置文件 > 共享配置文件 > 本地配置文件
  cloud:
    nacos:
      server-addr: 101.35.45.108:8848
      discovery:
        namespace: dev
        group: xuecheng-plus-project
      config:
        namespace: dev
        group: xuecheng-plus-project
        refresh-enabled: true
        file-extension: yaml
        # 从依赖的 service 模块中获取 nacos 配置文件
        extension-configs:
          - data-id: content-service-${spring.profiles.active}.yaml
            group: xuecheng-plus-project
            refresh: true
        shared-configs:
          - data-id: swagger-${spring.profiles.active}.yaml
            group: xuecheng-plus-common
            refresh:  true
          - data-id: logging-${spring.profiles.active}.yaml
            group: xuecheng-plus-common
            refresh: true

# 日志文件配置路径
#logging:
#  config: classpath:log4j2-dev.xml

server:
  servlet:
    context-path: /content
  port: 63040

